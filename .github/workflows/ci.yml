name: CI — TechFlow Task Manager

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Qualidade de Código e Testes Automatizados
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Verificar qualidade do código (flake8)
        run: |
          flake8 src/ tests/ \
            --max-line-length=120 \
            --exclude=__pycache__,.git,venv \
            --statistics

      - name: ✅ Executar testes com cobertura (pytest)
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: 📊 Gerar relatório XML de cobertura
        run: |
          pytest tests/ --cov=src --cov-report=xml --quiet

      - name: ☁️ Enviar cobertura ao Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
